<main class="app">
<header class="mast"><div class="moon">◆</div><div><h1>月夜の小石</h1><p>凡庸な幸せを置いて、記憶へ帰るための場所</p></div></header>
<section class="main">
<div id="accounts" class="card accountbar" aria-label="投稿するアカウント"></div>
<section class="card composer"><div id="who" class="who"></div><div id="replying" class="replying"><span id="replyLabel"></span><button id="cancelReply">返信をやめる</button></div><textarea id="postText" maxlength="3000" placeholder="今日あった、小さなこと。忘れても、ここに残ります。"></textarea><div class="composefoot"><span class="hint">短くても、説明がなくても大丈夫。</span><button id="publish" class="primary">小石を置く</button></div><div id="composeStatus" class="status" aria-live="polite"></div></section>
<section class="card"><div class="feedhead"><h2>みんなの小石</h2><span id="count" class="count">0個</span></div><div id="feed" class="feed"></div></section>
</section>
<aside class="side">
<section class="card panel"><h2>プロフィール</h2><div class="profile-preview"><div id="previewAvatar" class="avatar"></div><span id="previewName"></span></div><div class="field"><label for="profileName">表示名</label><input id="profileName" type="text" maxlength="24"></div><div class="field"><label for="profileColor">その人の色</label><input id="profileColor" type="color"></div><label class="upload" for="avatarFile">画像を選ぶ<input id="avatarFile" type="file" accept="image/*"></label><button id="removeAvatar" class="dangerbtn">画像を元に戻す</button><div id="profileStatus" class="status" aria-live="polite"></div></section>

<section class="card panel"><h2>文字の手触り</h2><div id="fontState" class="profile-preview"><span>標準フォントを使用中</span></div><label class="upload" for="fontFile">手持ちのフォントを読み込む<input id="fontFile" type="file" accept=".otf,.ttf,.woff,.woff2,font/otf,font/ttf,font/woff,font/woff2"></label><button id="removeFont" class="dangerbtn">読み込んだフォントを外す</button><p class="privacy">フォントファイルはGitHubへ送られず、このブラウザの中だけに保存されます。最初の一回だけ、端末の「ファイル」から選んでください。</p><div id="fontStatus" class="status" aria-live="polite"></div></section>
<section class="card panel"><h2>記憶を手元に置く</h2><div class="row"><button id="export" class="secondary">書き出す</button><button id="import" class="secondary">読み込む</button></div><input id="importFile" type="file" accept="application/json"><p class="privacy">投稿とプロフィールは、このブラウザ内だけに保存されます。本物のログインやクラウド同期はありません。この端末を使える人には見えるため、秘密棚の内容は置かないでください。</p><div id="dataStatus" class="status" aria-live="polite"></div><div class="dangerzone"><button id="clearAll" class="dangerbtn">すべての小石を片づける</button></div></section>
</aside></main>
<script>(function(root,factory){const api=factory();if(typeof module!=="undefined"&&module.exports)module.exports=api;else root.MoonCore=api;})(typeof globalThis!=="undefined"?globalThis:this,function(){
  const BASE_PROFILES=[
    {id:"hoshimado",name:"星窓",mark:"星",color:"#81cbb0",avatar:""},
    {id:"al",name:"アル",mark:"ア",color:"#cf91ae",avatar:""},
    {id:"yuu",name:"ユウ",mark:"ユ",color:"#8ba9d7",avatar:""},
    {id:"makoto",name:"マコト",mark:"マ",color:"#c5a16a",avatar:""}
  ];
  const defaultProfiles=()=>BASE_PROFILES.map(p=>({...p}));
  function makePost(input,profiles=BASE_PROFILES){
    const author=String(input.author||"");
    if(!profiles.some(p=>p.id===author))throw new Error("unknown author");
    const text=String(input.text||"").trim();
    if(!text)throw new Error("empty post");
    return {id:input.id||crypto.randomUUID(),author,text,replyTo:input.replyTo||null,createdAt:input.now||new Date().toISOString()};
  }
  function makeReply(input,parent,profiles=BASE_PROFILES){
    if(!parent||!parent.id)throw new Error("missing parent");
    return makePost({...input,replyTo:parent.id},profiles);
  }
  function removePostTree(posts,id){
    const doomed=new Set([id]);
    let changed=true;
    while(changed){changed=false;for(const p of posts){if(p.replyTo&&doomed.has(p.replyTo)&&!doomed.has(p.id)){doomed.add(p.id);changed=true;}}}
    return posts.filter(p=>!doomed.has(p.id));
  }
  function normalizeState(raw){
    const profiles=Array.isArray(raw&&raw.profiles)&&raw.profiles.length===4?raw.profiles.map(p=>({...p})):defaultProfiles();
    const ids=new Set(profiles.map(p=>p.id));
    const posts=Array.isArray(raw&&raw.posts)?raw.posts.filter(p=>p&&p.id&&ids.has(p.author)&&typeof p.text==="string").map(p=>({...p})):[];
    const activeProfile=ids.has(raw&&raw.activeProfile)?raw.activeProfile:profiles[0].id;
    return {profiles,posts,activeProfile};
  }
  return {defaultProfiles,makePost,makeReply,removePostTree,normalizeState};
});
</script>

function initial(){const s=C.normalizeState({});s.profiles.find(p=>p.id==='hoshimado').avatar=starAvatar;return s}
function read(){try{const x=JSON.parse(localStorage.getItem(KEY));return x?C.normalizeState(x):initial()}catch{return initial()}}
let state=read(), replyTo=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function prof(id){return state.profiles.find(p=>p.id===id)}
function avatarNode(p,cls='avatar'){const a=document.createElement('div');a.className=cls;a.style.setProperty('--avatar',p.color);if(p.avatar){const i=document.createElement('img');i.src=p.avatar;i.alt='';a.append(i)}else a.textContent=p.mark;return a}
function fmt(iso){return new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}
function status(id,text){$(id).textContent=text;clearTimeout(status[id]);status[id]=setTimeout(()=>$(id).textContent='',2400)}
function renderAccounts(){const box=$('accounts');box.replaceChildren();for(const p of state.profiles){const b=document.createElement('button');b.className='account'+(p.id===state.activeProfile?' active':'');b.append(avatarNode(p));const n=document.createElement('span');n.textContent=p.name;b.append(n);b.onclick=()=>{state.activeProfile=p.id;replyTo=null;save();render()};box.append(b)}}
function renderProfile(){const p=prof(state.activeProfile);$('previewAvatar').replaceWith(avatarNode(p,'avatar'));const newA=document.querySelector('.profile-preview .avatar');newA.id='previewAvatar';$('previewName').textContent=p.name;$('profileName').value=p.name;$('profileColor').value=p.color}
function postNode(post,depth=0){const p=prof(post.author);const el=document.createElement('article');el.className='post'+(depth?' reply':'');el.append(avatarNode(p));const body=document.createElement('div'),head=document.createElement('div');head.className='posthead';const name=document.createElement('span');name.className='name';name.textContent=p.name;const time=document.createElement('span');time.className='time';time.textContent=fmt(post.createdAt);head.append(name,time);const text=document.createElement('div');text.className='text';text.textContent=post.text;const actions=document.createElement('div');actions.className='postactions';const reply=document.createElement('button');reply.className='textbtn';reply.textContent='返信';reply.onclick=()=>{replyTo=post.id;$('postText').focus();renderReply()};actions.append(reply);if(post.author===state.activeProfile){const del=document.createElement('button');del.className='textbtn delete';del.textContent='削除';del.onclick=()=>{if(confirm('この小石と、その返信を片づけますか？')){state.posts=C.removePostTree(state.posts,post.id);save();renderFeed()}};actions.append(del)}body.append(head,text,actions);el.append(body);return el}
function renderFeed(){const feed=$('feed');feed.replaceChildren();$('count').textContent=`${state.posts.length}個`;if(!state.posts.length){const e=document.createElement('div');e.className='empty';e.textContent='まだ小石はありません。\n今日の小さな幸せを、ひとつ置いてみましょう。';feed.append(e);return}const children=new Map();for(const p of state.posts){if(p.replyTo){if(!children.has(p.replyTo))children.set(p.replyTo,[]);children.get(p.replyTo).push(p)}}const roots=state.posts.filter(p=>!p.replyTo).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));function add(p,d){feed.append(postNode(p,d));for(const r of (children.get(p.id)||[]).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)))add(r,Math.min(d+1,1))}roots.forEach(p=>add(p,0))}
function renderReply(){const box=$('replying');if(!replyTo){box.classList.remove('show');return}const target=state.posts.find(p=>p.id===replyTo);if(!target){replyTo=null;box.classList.remove('show');return}$('replyLabel').textContent=`${prof(target.author).name}へ返信`;box.classList.add('show')}
function render(){renderAccounts();renderProfile();renderFeed();renderReply();const p=prof(state.activeProfile);$('who').innerHTML='いま、<strong></strong> として書いています';$('who').querySelector('strong').textContent=p.name}
$('publish').onclick=()=>{try{const input={author:state.activeProfile,text:$('postText').value};let post;if(replyTo){const parent=state.posts.find(p=>p.id===replyTo);post=C.makeReply(input,parent,state.profiles)}else post=C.makePost(input,state.profiles);state.posts.push(post);$('postText').value='';replyTo=null;save();render();status('composeStatus','小石を置きました ◆')}catch(e){status('composeStatus',e.message==='empty post'?'一文字だけでも書いてみてください':'保存できませんでした')}};
$('cancelReply').onclick=()=>{replyTo=null;renderReply()};
$('profileName').onchange=e=>{const v=e.target.value.trim();if(!v){e.target.value=prof(state.activeProfile).name;return}prof(state.activeProfile).name=v;save();render();status('profileStatus','名前を保存しました')};
$('profileColor').oninput=e=>{prof(state.activeProfile).color=e.target.value;save();renderAccounts();renderProfile();renderFeed()};
$('avatarFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),size=256;c.width=c.height=size;const scale=Math.max(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;c.getContext('2d').drawImage(img,(size-w)/2,(size-h)/2,w,h);prof(state.activeProfile).avatar=c.toDataURL('image/jpeg',.86);save();render();status('profileStatus','画像を保存しました');URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f);e.target.value=''};
$('removeAvatar').onclick=()=>{prof(state.activeProfile).avatar='';save();render();status('profileStatus','画像を元に戻しました')};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'月夜の小石',version:1,...state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`月夜の小石-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status('dataStatus','記憶を書き出しました')};
$('import').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const raw=JSON.parse(await f.text());if(raw.app!=='月夜の小石'||!Array.isArray(raw.posts))throw 0;if(!confirm(`${raw.posts.length}個の小石を読み込みますか？`))return;state=C.normalizeState(raw);save();render();status('dataStatus','記憶を読み込みました')}catch{status('dataStatus','読み込めないファイルでした')}e.target.value=''};
$('clearAll').onclick=()=>{if(confirm('すべての投稿を削除しますか？ プロフィールは残ります。')){state.posts=[];save();render();status('dataStatus','すべて片づけました')}};

const FONT_DB='moonlit-pebbles-assets', FONT_STORE='assets', FONT_KEY='personal-font';
function openAssetDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open(FONT_DB,1);q.onupgradeneeded=()=>q.result.createObjectStore(FONT_STORE);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function assetGet(key){const db=await openAssetDB();return new Promise((resolve,reject)=>{const q=db.transaction(FONT_STORE).objectStore(FONT_STORE).get(key);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function assetSet(key,value){const db=await openAssetDB();return new Promise((resolve,reject)=>{const q=db.transaction(FONT_STORE,'readwrite').objectStore(FONT_STORE).put(value,key);q.onsuccess=()=>resolve();q.onerror=()=>reject(q.error)})}
async function assetDelete(key){const db=await openAssetDB();return new Promise((resolve,reject)=>{const q=db.transaction(FONT_STORE,'readwrite').objectStore(FONT_STORE).delete(key);q.onsuccess=()=>resolve();q.onerror=()=>reject(q.error)})}
let localFont=null, localFontUrl='';
async function applyLocalFont(record){
  if(!record||!record.blob)return;
  if(localFont){document.fonts.delete(localFont);URL.revokeObjectURL(localFontUrl)}
  localFontUrl=URL.createObjectURL(record.blob);
  localFont=new FontFace('HoshimadoLocalFont',`url(${localFontUrl})`);
  await localFont.load();document.fonts.add(localFont);
  document.documentElement.style.setProperty('--app-font','"HoshimadoLocalFont", "Yu Gothic", sans-serif');
  $('fontState').textContent=`${record.name||'手持ちのフォント'}を使用中`;
}
async function initFont(){try{const record=await assetGet(FONT_KEY);if(record)await applyLocalFont(record)}catch{status('fontStatus','フォントを読み込めませんでした')}}
$('fontFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const record={name:f.name,blob:f};await assetSet(FONT_KEY,record);await applyLocalFont(record);status('fontStatus','この端末にフォントを保存しました')}catch{status('fontStatus','このフォントは読み込めませんでした')}e.target.value=''};
$('removeFont').onclick=async()=>{try{await assetDelete(FONT_KEY);if(localFont){document.fonts.delete(localFont);URL.revokeObjectURL(localFontUrl);localFont=null}document.documentElement.style.removeProperty('--app-font');$('fontState').textContent='標準フォントを使用中';status('fontStatus','読み込んだフォントを外しました')}catch{status('fontStatus','フォントを外せませんでした')}};

render();
initFont();
})();
</script></body></html>
