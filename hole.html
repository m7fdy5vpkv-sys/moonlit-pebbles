<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>気持ちの穴 — 月夜の小石</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:20px 16px;min-height:100dvh;background:radial-gradient(circle at 80% 8%,#eedda333,transparent 25%),linear-gradient(165deg,#0a1316,#18272d 58%,#0b1518);color:#f4f1e7;font-family:var(--app-font,"Yu Gothic",sans-serif);line-height:1.8}main{max-width:620px;margin:auto}h1{font-weight:400;font-size:1.8rem;letter-spacing:.12em;margin:20px 0 8px}h2{font-size:1.1rem;font-weight:400}p{margin:8px 0}a{color:#c5ded2;display:inline-flex;align-items:center;min-height:44px}section{margin:22px 0}label{display:block}textarea{display:block;width:100%;min-height:150px;resize:vertical;background:#f4f1e7;color:#172221;border:1px solid #ccd7d1;border-radius:16px;padding:14px;font:inherit;line-height:1.8}button,.picker{font:inherit;min-height:44px;padding:8px 16px;border:1px solid #97b8a9;border-radius:12px;background:#dfe8e3;color:#29463e;cursor:pointer;max-width:100%;white-space:normal}button:focus-visible,a:focus-visible,textarea:focus-visible,.picker:focus-within{outline:3px solid #eedda3;outline-offset:4px}.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}.soil{height:80px;border-radius:50%;background:radial-gradient(ellipse,#080e10 30%,#35463c 65%,transparent 68%);max-width:310px;margin:28px auto}#entries p{white-space:pre-wrap;overflow-wrap:anywhere;border-left:2px solid #829a8a;padding:12px}#status{min-height:1.8em;color:#c5ded2}.privacy{font-size:.85rem;color:#becdc7;overflow-wrap:anywhere}dialog{width:min(440px,calc(100% - 32px));max-height:90dvh;overflow:auto;background:#f4f1e7;color:#172221;border:0;border-radius:18px;padding:22px}dialog::backdrop{background:#061013bb}[hidden]{display:none!important}input[type=file]{width:100%;min-height:44px;font:inherit}details{margin:24px 0}summary{min-height:44px;cursor:pointer}body,main,section{min-width:0} @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><a href="index.html">小石の庭へ戻る</a><h1>気持ちの穴</h1><p>短い言葉のまま、ここに。</p><section><label for="words">置いていく言葉</label><textarea id="words" placeholder="ひとことでも。"></textarea><div class="row"><button id="throw">投げる</button></div><p id="status" role="status"></p></section><section aria-label="言葉を置いた土"><div class="soil" aria-hidden="true"></div><p id="marker" style="text-align:center"></p><div class="row"><button id="reveal">置いた言葉を見る</button><button id="hide" hidden>隠す</button></div><div id="entries" hidden></div></section><section><button id="fill">穴を埋める</button><p class="privacy">穴の言葉と書きかけだけを消します。小石・プロフィール・フォントは残ります。端末や外部のバックアップまでは消せません。</p></section><dialog id="confirm" aria-labelledby="confirmTitle"><h2 id="confirmTitle">穴を埋めますか？</h2><p>置いた言葉と書きかけを消します。</p><div class="row"><button id="cancel" autofocus>やめる</button><button id="confirmFill">埋める</button></div><p id="resetStatus" role="status"></p></dialog><p class="privacy">書きかけもこのブラウザに保存します。</p><p class="privacy">言葉はこのブラウザだけに保存されます。送信・同期はありません。この端末を使う人は見ることができます。小石の書き出しには含まれません。サイトのデータを消すと失われます。別の端末・ブラウザには移りません。</p><details><summary>文字の手触り</summary><label for="fontFile">手持ちのフォントを読み込む</label><input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2"><p id="fontState">標準フォントを使用中</p><p id="fontStatus" role="status"></p><p class="privacy">フォントもこのブラウザにだけ保存します。庭と共通です。外すときは庭から。</p></details></main><script src="hole.js"></script><script src="local-font.js"></script></body></html>
